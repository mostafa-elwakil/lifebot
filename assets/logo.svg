<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Rakez ركّز — robot + focus eye -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#1a1b26" stroke="#7aa2f7" stroke-width="6"/>
  <!-- antenna -->
  <line x1="128" y1="52" x2="128" y2="30" stroke="#bb9af7" stroke-width="8" stroke-linecap="round"/>
  <circle cx="128" cy="24" r="10" fill="#bb9af7"/>
  <!-- ears -->
  <rect x="34" y="118" width="18" height="44" rx="9" fill="#7aa2f7"/>
  <rect x="204" y="118" width="18" height="44" rx="9" fill="#7aa2f7"/>
  <!-- head -->
  <rect x="52" y="62" width="152" height="132" rx="40" fill="#24283b" stroke="#7aa2f7" stroke-width="6"/>
  <!-- normal eye -->
  <circle cx="102" cy="122" r="14" fill="#9ece6a"/>
  <!-- focus eye: pomodoro timer -->
  <circle cx="158" cy="122" r="24" fill="#1a1b26" stroke="#ff6b6b" stroke-width="6"/>
  <circle cx="158" cy="122" r="24" fill="none" stroke="#9ece6a" stroke-width="3" stroke-dasharray="10 7"/>
  <line x1="158" y1="122" x2="158" y2="108" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="158" y1="122" x2="168" y2="126" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="158" cy="122" r="4" fill="#ffffff"/>
  <!-- smile -->
  <path d="M100 158 Q128 178 156 158" fill="none" stroke="#7aa2f7" stroke-width="7" stroke-linecap="round"/>
</svg>
