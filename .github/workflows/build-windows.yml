name: build-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Optional code signing. Add repository secrets
      #   SIGNING_PFX_BASE64    - base64 of packaging/rakez-codesign.pfx
      #   SIGNING_PFX_PASSWORD  - its password
      # (see packaging/SIGNING.md). Without them the build stays unsigned.
      SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
      SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Import code-signing certificate
        if: env.SIGNING_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "rakez-codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $pwd = ConvertTo-SecureString -String $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pwd | Out-Null
          Remove-Item $pfx -Force
          Write-Host "Code-signing certificate imported."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Build Rakez.exe (PyInstaller)
        run: python packaging/build_windows.py

      - name: Sign Rakez.exe
        if: env.SIGNING_PFX_BASE64 != ''
        shell: pwsh
        run: .\packaging\sign_windows.ps1 -Path dist\Rakez.exe

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc packaging\Rakez.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Sign installer
        if: env.SIGNING_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Rakez-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "Installer not found" }
          .\packaging\sign_windows.ps1 -Path $setup.FullName

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rakez-Setup
          path: dist/Rakez-Setup-*.exe
          retention-days: 30

      - name: Drop assets from a previous run of this tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $names = gh release view $tag --json assets --jq ".assets[].name" 2>$null
          if ($LASTEXITCODE -eq 0 -and $names) {
            foreach ($name in $names) {
              Write-Host "Removing existing asset $name"
              gh release delete-asset $tag $name --yes
            }
          }
          # a missing release (first build of this tag) is not an error
          exit 0

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Rakez-Setup-*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Releases created with GITHUB_TOKEN are attributed to
          # github-actions[bot]. To publish as your own account, add a
          # fine-grained PAT with "Contents: read and write" as the
          # repository secret RELEASE_TOKEN (Settings → Secrets → Actions).
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
